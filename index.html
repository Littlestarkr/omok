<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>오목 (Omok) - 지적 동반자와의 대국</title>
    <style>
        :root {
            --bg-color: #f4f4f5;
            --panel-bg: #ffffff;
            --text-color: #27272a;
            --board-bg: #dcb35c;
            --line-color: #593d18;
            --accent-color: #3f3f46;
            --muted-color: #71717a;
            --border-color: #d4d4d8;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-color: #18181b;
                --panel-bg: #27272a;
                --text-color: #f4f4f5;
                --board-bg: #b8863f;
                --line-color: #2e1f0c;
                --accent-color: #a1a1aa;
                --muted-color: #a1a1aa;
                --border-color: #3f3f46;
            }
        }
        :root[data-theme="dark"] {
            --bg-color: #18181b;
            --panel-bg: #27272a;
            --text-color: #f4f4f5;
            --board-bg: #b8863f;
            --line-color: #2e1f0c;
            --accent-color: #a1a1aa;
            --muted-color: #a1a1aa;
            --border-color: #3f3f46;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: max(6px, env(safe-area-inset-top, 0px)) 6px max(6px, env(safe-area-inset-bottom, 0px));
        }

        .container {
            background-color: var(--panel-bg);
            padding: 10px 8px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            max-width: 640px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.15rem;
            margin: 0 0 2px;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .subtitle {
            font-size: 0.78rem;
            color: var(--muted-color);
            margin-bottom: 8px;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        select, button {
            padding: 5px 10px;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--panel-bg);
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:focus, button:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background-color: #27272a;
            color: #fff;
            border: none;
            font-weight: 500;
        }

        button:hover {
            background-color: #3f3f46;
        }

        .status {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 6px;
            height: 20px;
            display: flex;
            align-items: center;
        }

        .board-wrapper {
            background-color: var(--board-bg);
            padding: 4px;
            border-radius: 8px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.15);
            cursor: pointer;
            max-width: 100%;
            width: 100%;
            overflow-x: auto;
            display: flex;
            justify-content: center;
        }

        canvas {
            display: block;
            width: 100%;
            max-width: 620px;
            height: auto;
        }

        .footer-note {
            margin-top: 8px;
            font-size: 0.75rem;
            color: var(--muted-color);
            text-align: center;
        }

        .legend {
            margin-top: 5px;
            font-size: 0.72rem;
            color: var(--muted-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid #ef4444;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>오 목 (Omok)</h1>
    <div class="subtitle">사유를 다듬는 AI와의 대국 공간</div>

    <div class="controls">
        <div>
            <label for="difficulty">난이도: </label>
            <select id="difficulty">
                <option value="easy">초보용 (직관적)</option>
                <option value="normal" selected>중급용 (균형적)</option>
                <option value="hard">전문가용 (전략적)</option>
            </select>
        </div>
        <button id="restartBtn">새 게임 시작</button>
        <button id="undoBtn">한 수 무르기</button>
    </div>

    <div class="status" id="statusText">흑돌(작가님)의 차례입니다.</div>

    <div class="board-wrapper">
        <canvas id="omokBoard" width="450" height="450"></canvas>
    </div>

    <div class="legend"><span class="legend-dot"></span> AI(백돌)의 가장 최근 착수 위치</div>
    <div class="footer-note">바둑판 위에서 펼쳐지는 침묵의 대화</div>
</div>

<script>
    const canvas = document.getElementById('omokBoard');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('statusText');
    const restartBtn = document.getElementById('restartBtn');
    const undoBtn = document.getElementById('undoBtn');
    const difficultySelect = document.getElementById('difficulty');

    const BOARD_SIZE = 15;
    const CELL_SIZE = canvas.width / (BOARD_SIZE + 1);

    // 0: 빈칸, 1: 흑(플레이어), 2: 백(AI)
    let board = [];
    let currentPlayer = 1; // 1: 흑, 2: 백
    let gameOver = false;
    let isAITurn = false;
    let lastAIMove = null; // { r, c } AI가 가장 최근에 둔 위치
    let moveHistory = []; // { r, c, player } 순서대로 기록 (무르기용)

    function initBoard() {
        board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
        gameOver = false;
        currentPlayer = 1;
        isAITurn = false;
        lastAIMove = null;
        moveHistory = [];
        statusText.textContent = "흑돌(작가님)의 차례입니다.";
        drawBoard();
    }

    function drawBoard() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#593d18';
        ctx.lineWidth = 1;

        for (let i = 0; i < BOARD_SIZE; i++) {
            const pos = CELL_SIZE * (i + 1);
            ctx.beginPath();
            ctx.moveTo(CELL_SIZE, pos);
            ctx.lineTo(CELL_SIZE * BOARD_SIZE, pos);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(pos, CELL_SIZE);
            ctx.lineTo(pos, CELL_SIZE * BOARD_SIZE);
            ctx.stroke();
        }

        const starPoints = [3, 7, 11];
        ctx.fillStyle = '#593d18';
        for (let x of starPoints) {
            for (let y of starPoints) {
                ctx.beginPath();
                ctx.arc(CELL_SIZE * (x + 1), CELL_SIZE * (y + 1), 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c] !== 0) {
                    drawStone(c, r, board[r][c]);
                }
            }
        }

        if (lastAIMove) {
            drawLastMoveMarker(lastAIMove.c, lastAIMove.r);
        }
    }

    function drawStone(x, y, player) {
        const cx = CELL_SIZE * (x + 1);
        const cy = CELL_SIZE * (y + 1);

        ctx.beginPath();
        ctx.arc(cx, cy, CELL_SIZE * 0.42, 0, Math.PI * 2);

        const gradient = ctx.createRadialGradient(cx - 3, cy - 3, 2, cx, cy, CELL_SIZE * 0.42);
        if (player === 1) {
            gradient.addColorStop(0, '#52525b');
            gradient.addColorStop(1, '#09090b');
        } else {
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(1, '#d4d4d8');
        }

        ctx.fillStyle = gradient;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
        ctx.shadowBlur = 4;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;
        ctx.fill();

        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
    }

    function drawLastMoveMarker(x, y) {
        const cx = CELL_SIZE * (x + 1);
        const cy = CELL_SIZE * (y + 1);

        ctx.beginPath();
        ctx.arc(cx, cy, CELL_SIZE * 0.16, 0, Math.PI * 2);
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 2.5;
        ctx.stroke();
    }

    canvas.addEventListener('click', (e) => {
        if (gameOver || isAITurn || currentPlayer !== 1) return;

        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;

        const c = Math.round(mouseX / CELL_SIZE) - 1;
        const r = Math.round(mouseY / CELL_SIZE) - 1;

        if (c >= 0 && c < BOARD_SIZE && r >= 0 && r < BOARD_SIZE) {
            if (board[r][c] === 0) {
                makeMove(r, c, 1);
                if (!gameOver) {
                    isAITurn = true;
                    statusText.textContent = "AI가 사유하는 중입니다...";
                    setTimeout(aiTurn, 400);
                }
            }
        }
    });

    function makeMove(r, c, player) {
        board[r][c] = player;
        moveHistory.push({ r, c, player });
        if (player === 2) {
            lastAIMove = { r, c };
        }
        drawBoard();

        if (checkWin(r, c, player)) {
            gameOver = true;
            if (player === 1) {
                statusText.textContent = "흑돌(작가님)의 승리입니다.";
            } else {
                statusText.textContent = "백돌(AI)의 승리입니다.";
            }
            return;
        }

        currentPlayer = currentPlayer === 1 ? 2 : 1;
        if (!gameOver) {
            statusText.textContent = currentPlayer === 1 ? "흑돌(작가님)의 차례입니다." : "백돌(AI)의 차례입니다.";
        }
    }

    function checkWin(r, c, player) {
        const directions = [
            { dr: 0, dc: 1 },
            { dr: 1, dc: 0 },
            { dr: 1, dc: 1 },
            { dr: 1, dc: -1 }
        ];

        for (let { dr, dc } of directions) {
            let count = 1;
            let i = 1;
            while (true) {
                let nr = r + dr * i;
                let nc = c + dc * i;
                if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE || board[nr][nc] !== player) break;
                count++;
                i++;
            }
            i = 1;
            while (true) {
                let nr = r - dr * i;
                let nc = c - dc * i;
                if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE || board[nr][nc] !== player) break;
                count++;
                i++;
            }

            if (count >= 5) return true;
        }
        return false;
    }

    function aiTurn() {
        if (gameOver) return;
        const difficulty = difficultySelect.value;
        let move = null;

        if (difficulty === 'easy') {
            move = getEasyMove();
        } else if (difficulty === 'normal') {
            move = getNormalMove();
        } else {
            move = getHardMove();
        }

        if (move) {
            makeMove(move.r, move.c, 2);
        }
        isAITurn = false;
    }

    function getEasyMove() {
        let critical = findCriticalMove(2);
        if (critical) return critical;
        critical = findCriticalMove(1);
        if (critical) return critical;

        let emptyCells = [];
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c] === 0) emptyCells.push({ r, c });
            }
        }
        if (emptyCells.length === 0) return null;
        return emptyCells[Math.floor(Math.random() * emptyCells.length)];
    }

    function getNormalMove() {
        let move = findCriticalMove(2);
        if (move) return move;
        move = findCriticalMove(1);
        if (move) return move;

        return getBestScoredMove();
    }

    function getHardMove() {
        let move = findCriticalMove(2);
        if (move) return move;
        move = findCriticalMove(1);
        if (move) return move;

        let bestScore = -1;
        let bestMoves = [];

        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c] === 0) {
                    if (!hasNeighbor(r, c, 2)) continue;

                    let score = evaluatePosition(r, c);
                    if (score > bestScore) {
                        bestScore = score;
                        bestMoves = [{ r, c }];
                    } else if (score === bestScore) {
                        bestMoves.push({ r, c });
                    }
                }
            }
        }

        if (bestMoves.length === 0) {
            const center = Math.floor(BOARD_SIZE / 2);
            if (board[center][center] === 0) {
                return { r: center, c: center };
            }
            return getBestScoredMove();
        }

        return bestMoves[Math.floor(Math.random() * bestMoves.length)];
    }

    function findCriticalMove(player) {
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c] === 0) {
                    board[r][c] = player;
                    let win = checkWin(r, c, player);
                    board[r][c] = 0;
                    if (win) return { r, c };
                }
            }
        }
        return null;
    }

    function hasNeighbor(r, c, dist) {
        for (let dr = -dist; dr <= dist; dr++) {
            for (let dc = -dist; dc <= dist; dc++) {
                if (dr === 0 && dc === 0) continue;
                let nr = r + dr;
                let nc = c + dc;
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                    if (board[nr][nc] !== 0) return true;
                }
            }
        }
        return false;
    }

    function evaluatePosition(r, c) {
        let score = 0;
        score += getScoreForPlayer(r, c, 2) * 1.2;
        score += getScoreForPlayer(r, c, 1);
        return score;
    }

    function getScoreForPlayer(r, c, player) {
        board[r][c] = player;
        let totalScore = 0;
        const directions = [{ dr: 0, dc: 1 }, { dr: 1, dc: 0 }, { dr: 1, dc: 1 }, { dr: 1, dc: -1 }];

        for (let { dr, dc } of directions) {
            let count = 1;
            let openEnds = 0;

            let i = 1;
            while (true) {
                let nr = r + dr * i;
                let nc = c + dc * i;
                if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) break;
                if (board[nr][nc] === player) {
                    count++;
                    i++;
                } else {
                    if (board[nr][nc] === 0) openEnds++;
                    break;
                }
            }

            i = 1;
            while (true) {
                let nr = r - dr * i;
                let nc = c - dc * i;
                if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) break;
                if (board[nr][nc] === player) {
                    count++;
                    i++;
                } else {
                    if (board[nr][nc] === 0) openEnds++;
                    break;
                }
            }

            if (count >= 5) totalScore += 100000;
            else if (count === 4 && openEnds === 2) totalScore += 10000;
            else if (count === 4 && openEnds === 1) totalScore += 1000;
            else if (count === 3 && openEnds === 2) totalScore += 1000;
            else if (count === 3 && openEnds === 1) totalScore += 100;
            else if (count === 2 && openEnds === 2) totalScore += 50;
        }

        board[r][c] = 0;
        return totalScore;
    }

    function getBestScoredMove() {
        let bestScore = -1;
        let bestMove = null;
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c] === 0) {
                    let score = evaluatePosition(r, c);
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = { r, c };
                    }
                }
            }
        }
        return bestMove || { r: Math.floor(BOARD_SIZE / 2), c: Math.floor(BOARD_SIZE / 2) };
    }

    // 한 수 무르기: AI의 마지막 착수와 플레이어의 마지막 착수를 함께 되돌려
    // 항상 플레이어(흑) 차례로 되돌아온다.
    function undoMove() {
        if (isAITurn || moveHistory.length === 0) return;

        let last = moveHistory.pop();
        board[last.r][last.c] = 0;

        if (last.player === 2 && moveHistory.length > 0) {
            let prev = moveHistory[moveHistory.length - 1];
            if (prev.player === 1) {
                moveHistory.pop();
                board[prev.r][prev.c] = 0;
            }
        }

        lastAIMove = null;
        for (let i = moveHistory.length - 1; i >= 0; i--) {
            if (moveHistory[i].player === 2) {
                lastAIMove = { r: moveHistory[i].r, c: moveHistory[i].c };
                break;
            }
        }

        gameOver = false;
        currentPlayer = 1;
        isAITurn = false;
        statusText.textContent = "흑돌(작가님)의 차례입니다.";
        drawBoard();
    }

    restartBtn.addEventListener('click', initBoard);
    undoBtn.addEventListener('click', undoMove);

    initBoard();
</script>

</body>
</html>
